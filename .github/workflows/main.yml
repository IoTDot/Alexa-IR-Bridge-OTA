# Workflow name
name: CI

# Triggers: Run on pushes to release branches or version tags
on:
  push:
    branches:
      - 'release/v*' # Matches branches like release/v1.0, release/v2.3.4
    tags:
      - 'v*'         # Matches tags like v1.0, v2.3.4

# Permissions required by the jobs
permissions:
  contents: write      # Needed for creating releases and uploading assets
  pull-requests: write # Potentially needed by release actions (good practice to include if unsure)

# Define the jobs to run
jobs:
  # Job 1: Build for ESP01_1M
  build1:
    name: Build ESP01_1M
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.1.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Disable post-build script in platformio.ini for CI
        run: |
          # Zakomentuj linie zaczynające się od 'extra_scripts ='
          sed -i -E '/^[[:space:]]*extra_scripts[[:space:]]*=/s/^/#/' platformio.ini
          echo "--- platformio.ini after modification ---"
          cat platformio.ini
          echo "---------------------------------------"

      - name: Install PlatformIO
        run: |
          pip install -U platformio
          platformio update

      - name: Compile Code for ESP01_1M
        run: |
          platformio run -e esp01_1m

      - name: Upload ESP01_1M Artifact
        uses: actions/upload-artifact@v4.3.1
        with:
          name: Alexa-IR-bridge-ESP01_1M # Artifact name (matches download later)
          path: .pio/build/esp01_1m/firmware.bin
          if-no-files-found: error # Fail if firmware.bin is missing

  # Job 2: Build for NodeMCUv2 (ESP8266)
  build2:
    name: Build NodeMCUv2 (ESP8266)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.1.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Disable post-build script in platformio.ini for CI
        run: |
          # Zakomentuj linie zaczynające się od 'extra_scripts ='
          sed -i -E '/^[[:space:]]*extra_scripts[[:space:]]*=/s/^/#/' platformio.ini
          echo "--- platformio.ini after modification ---"
          cat platformio.ini
          echo "---------------------------------------"

      - name: Install PlatformIO
        run: |
          pip install -U platformio
          platformio update

      - name: Compile Code for NodeMCUv2
        run: |
          platformio run -e nodemcuv2

      - name: Upload NodeMCUv2 Artifact
        uses: actions/upload-artifact@v4.3.1
        with:
          name: Alexa-IR-bridge-ESP8266 # Artifact name
          path: .pio/build/nodemcuv2/firmware.bin
          if-no-files-found: error

  # Job 3: Build for ESP32 Dev Module
  build3:
    name: Build ESP32 Dev Module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.1.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Disable post-build script in platformio.ini for CI
        run: |
          # Zakomentuj linie zaczynające się od 'extra_scripts ='
          sed -i -E '/^[[:space:]]*extra_scripts[[:space:]]*=/s/^/#/' platformio.ini
          echo "--- platformio.ini after modification ---"
          cat platformio.ini
          echo "---------------------------------------"

      - name: Install PlatformIO
        run: |
          pip install -U platformio
          platformio update

      - name: Compile Code for ESP32 Dev
        run: |
          platformio run -e esp32dev

      - name: Upload ESP32 Artifact
        uses: actions/upload-artifact@v4.3.1
        with:
          name: Alexa-IR-bridge-ESP32 # Artifact name
          path: .pio/build/esp32dev/firmware.bin
          if-no-files-found: error

  # Job 4: Create Release (runs only after all builds succeed)
  release:
    name: Release project
    runs-on: ubuntu-latest
    # Ensure this job runs only if all build jobs were successful
    needs: [build1, build2, build3]
    # Only run this job if the trigger was a tag push (typical release scenario)
    # You might want to adjust this condition based on your exact release strategy
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      # Step 1: Determine the version from the tag that triggered the workflow
      # Using github.ref_name which holds the tag name (e.g., v1.2.3)
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
        # Example: If tag is v1.2.3, this sets steps.get_version.outputs.VERSION to v1.2.3

      # Step 2: Download all artifacts from the build jobs
      - name: Download all artifacts
        uses: actions/download-artifact@v4.1.4
        with:
          # No specific name provided, download all artifacts created in this workflow run
          path: artifacts # Download into an 'artifacts' directory

      # Step 3: Create the GitHub Release
      - name: Create GitHub release
        id: create-new-release
        uses: softprops/action-gh-release@v2 # Use v2 for latest features/fixes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Use the version derived from the tag
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          # Create release name using the version
          name: Alexa-IR-bridge ${{ steps.get_version.outputs.VERSION }}
          # Optional: Mark as pre-release if needed (e.g., if tag contains '-beta')
          # prerelease: contains(steps.get_version.outputs.VERSION, '-')
          # Optional: Add release notes from a file or generate automatically
          # body_path: path/to/CHANGELOG.md
          # generate_release_notes: true # Requires more setup potentially

      # Step 4: Upload ESP01_1M firmware to the release
      - name: Upload ESP01_1M release asset
        uses: actions/upload-release-asset@v1 # Switched to the official action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create-new-release.outputs.upload_url }}
          asset_path: artifacts/Alexa-IR-bridge-ESP01_1M/firmware.bin
          asset_name: Alexa-IR-bridge-ESP01_1M_${{ steps.get_version.outputs.VERSION }}.bin
          asset_content_type: application/octet-stream

      # Step 5: Upload NodeMCU V2 (ESP8266) firmware to the release
      - name: Upload NodeMCU V2 release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create-new-release.outputs.upload_url }}
          asset_path: artifacts/Alexa-IR-bridge-ESP8266/firmware.bin
          asset_name: Alexa-IR-bridge-ESP8266_${{ steps.get_version.outputs.VERSION }}.bin
          asset_content_type: application/octet-stream

      # Step 6: Upload ESP32 firmware to the release
      - name: Upload ESP32 release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create-new-release.outputs.upload_url }}
          asset_path: artifacts/Alexa-IR-bridge-ESP32/firmware.bin
          asset_name: Alexa-IR-bridge-ESP32_${{ steps.get_version.outputs.VERSION }}.bin
          asset_content_type: application/octet-stream